<script>
(function(){

  const $ = id => document.getElementById(id);

  const safeDecode = str=>{
    try{
      return decodeURIComponent(atob(str));
    }catch{
      return null;
    }
  };

  const urlParam = new URLSearchParams(location.search);

  const encoded = urlParam.get("url");
  const title = urlParam.get("title");

  if(title){
    $("tg-title").textContent = title;
    document.title = title + " - Live Score";
  }

  if(!encoded){
    $("tg-loader").innerHTML = "Data tidak tersedia";
    return;
  }

  const decodedURL = safeDecode(encoded);

  if(!decodedURL || !decodedURL.startsWith("http")){
    $("tg-loader").innerHTML = "URL tidak valid";
    return;
  }

  const iframe = $("tg-frame");
  const loader = $("tg-loader");

  iframe.src = decodedURL;

  iframe.onload = ()=>{
    iframe.classList.add("show");
    loader.style.opacity="0";

    setTimeout(()=>{
      loader.remove();
    },300);
  };

})();
</script>
